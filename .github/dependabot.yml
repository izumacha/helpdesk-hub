# Dependabot 設定: 依存関係の既知脆弱性・更新を毎週チェックして PR を作成する
# (CLAUDE.md §9「依存（サプライチェーン）を管理する」に基づく)
version: 2
updates:
  # package.json / package-lock.json の npm 依存 (Next.js / Prisma / next-auth 等)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる (§12)
      prefix: "chore(deps)"
    groups:
      # minor / patch 更新は 1 本の PR にまとめてレビュー負荷を下げる (major は個別 PR)
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # ESLint の major 更新 (9 → 10 以降) を保留する。
      #
      # なぜ止めるのか: 上流が未対応で、上げると lint が必ず落ちるため。
      #   eslint-config-next@16.3.0 は peerDependencies に `eslint: ">=9.0.0"` と
      #   書いており、npm は eslint 10 のインストールを許してしまう。しかし同 config が
      #   内包する eslint-plugin-react は最新 7.37.5 でも peer が `^9.7` までで、
      #   ESLint 10 で削除された `context.getFilename()` を呼ぶ。結果、設定を 1 行も
      #   変えていなくても実行時に
      #     TypeError: Error while loading rule 'react/display-name':
      #       contextOrFilename.getFilename is not a function
      #   で exit code 2 になる (Dependabot PR #303 の Lint / Typecheck / Unit tests
      #   ジョブが実際にこれで落ちている)。アプリ側の eslint.config.mjs では回避できず、
      #   ESLint 10 対応版の eslint-plugin-react も現時点で存在しない。
      #
      # 外す条件: eslint-config-next が引き込む eslint プラグイン **すべて**
      #   (eslint-plugin-react / -import / -jsx-a11y / -react-hooks) の peerDependencies が
      #   eslint 10 以上を含む版になったら、この ignore を削除して major 更新を取る。
      #   **react 1 つだけが対応しても外せない** — 同じ lint 実行に載る他のプラグインが
      #   eslint を 9 までに制限したままなら、結局 lint は落ちる。
      #   この条件は tests/dependabot-eslint-guard.test.ts が package-lock.json の
      #   解決済み peer 範囲を読んで自動で見張る。人が気付くのを待たずに、上流が
      #   eslint 10 に言及した時点でテストが落ちる (保留が効いている限り package.json の
      #   eslint は 9 のまま動かないので、「package.json を見る」判定だけでは
      #   この条件は永久に発火しない — 判定が循環してしまう)。
      #
      # 効き方: major 更新だけを対象にするので、9 系の minor / patch 更新は従来どおり
      #   npm-minor-and-patch グループで届く。ただし 9 系で修正されない脆弱性が出た場合は
      #   この ignore ごと見直す必要があるため、放置ではなく「上流待ちの保留」として扱う
      #   (§9 依存の管理)。
      #
      # security updates との関係: `version-update:` 接頭辞の update-types は
      #   version updates 向けの指定で、Dependabot security updates には適用されない
      #   （したがって eslint に CVE が出れば、この ignore があっても security update の PR は
      #   届く）という理解でこの形にしている。**ただしこの環境からは docs.github.com へ
      #   到達できず裏取りできていない**ので、次の順序で扱うこと:
      #     1. CVE が出たらまず security update の PR が来るかを確認する。
      #     2. 来ないと分かった場合に限り、9 系へ修正が入っているならそれを取り込み、
      #        10 系にしか修正が無いなら保留の解除ごと(= lint の破損対応込みで)判断する。
      #   **CVE を見た時点で反射的にこの ignore を外さないこと** — 外すと eslint 10 が入り、
      #   上に書いた lint の破損をそのまま踏む。挙動を確認できたらこの段落を確定形に直す。
      #   参照: GitHub Docs の Dependabot options reference (ignore / update-types の節)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @types/node の major 更新を、動かす Node.js の major と切り離さないための保留。
      #
      # なぜ止めるのか: `@types/node` の major は **Node 本体のリリース系列に対応する**
      #   (DefinitelyTyped の慣習)。つまり `@types/node@26` は「Node 26 の API 一覧」で、
      #   Node 22 で動くコードの型チェックに使うものではない。ところがここがずれても
      #   **lint も型チェックも通ってしまう** — むしろ型が API の存在を主張するぶん、
      #   Node 22 に無い API を書いても `tsc --noEmit` が緑のまま通り、壊れるのは本番の
      #   実行時 (`TypeError: x is not a function`) になる。実際 Dependabot の
      #   22 → 26 提案 (PR #310) は 4 ジョブすべて緑だったが、それは「動くから」ではなく
      #   「型が広がったから」でしかない。CI の緑が判断材料にならない fail-open なので、
      #   バージョンの主導権を Dependabot ではなく「ランタイムを上げる判断」に置く。
      #
      # 外す条件: **この ignore は恒久的に major を止めるものではない。** 動かす Node を
      #   次の LTS へ上げるときは、`.nvmrc` / `.github/workflows/ci.yml` の NODE_VERSION /
      #   `Dockerfile` の `FROM node:<major>` / `package.json` の `engines.node` を同じ
      #   major へ揃え、**同じ PR で `@types/node` も新しい major へ上げる**。
      #   ignore はそのまま残してよい (止めたいのは「ランタイムと無関係な単独 major 更新」)。
      #   この整合は tests/types-node-runtime-alignment.test.ts が機械的に見張り、
      #   4 か所の食い違い・型と実行時のずれ・保留の消失/効きすぎを検出する。
      #
      # 効き方: major 更新だけを対象にするので、22 系の minor / patch 更新は従来どおり
      #   npm-minor-and-patch グループで届く (型定義に脆弱性 CVE が出る形は考えにくいが、
      #   eslint の保留と同じく「放置」ではなく「上げ方を管理する保留」として扱う。§9)。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Dockerfile のベースイメージ (node 等)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる (§12)
      prefix: "chore(docker)"

  # docker-compose.yml のサービスイメージ (postgres:16-alpine)。docker エコシステムは
  # Dockerfile しか走査しないため、compose ファイルは専用エコシステムで別途監視する
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる (§12)
      prefix: "chore(docker)"

  # .github/workflows/ で使う GitHub Actions (ci / backup / sla-reminders / trial-reminders)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # コミット規約 type(scope) に合わせる (§12)
      prefix: "chore(ci)"
